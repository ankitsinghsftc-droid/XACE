# cbindgen.toml — cbindgen configuration for XACE FFI header generation
# Documentation: https://github.com/mozilla/cbindgen/blob/master/docs.md

language = "C"
header   = """
/*
 * xace.h — XACE Engine Adapter C API
 *
 * This file is AUTO-GENERATED by cbindgen from packages/engine-adapter/src/ffi/.
 * DO NOT EDIT MANUALLY.
 *
 * To regenerate:
 *   cargo build -p xace-engine-adapter
 *
 * CI staleness check:
 *   ci/check_ffi_header.sh
 *
 * Usage (Unity C#):
 *   [DllImport("xace")] extern static int xace_init(out IntPtr world, ulong seed, uint delta_buf);
 *   [DllImport("xace")] extern static int xace_tick(IntPtr world);
 *   ...
 */
"""
trailer = ""

[export]
# Only export things explicitly tagged with #[no_mangle] and pub extern "C"
# Plus the XaceErrorCode enum (needed for callers to interpret return values)
include = ["XaceErrorCode", "XACE_VERSION"]

[enum]
# Prefix all enum variants with the enum name to avoid C name collisions
# XaceErrorCode::Ok → XACE_ERROR_CODE_OK
prefix_with_name = true
rename_variants  = "ScreamingSnakeCase"

[parse]
parse_deps          = false
extra_bindings      = []

[layout]
packed = false

[fn]
# All exported functions return int (XaceErrorCode), documented above the declaration
must_use = false